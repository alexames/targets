name: CI - Build Examples

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

jobs:
  build-examples:
    name: Build Examples on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            triplet: x64-linux
          - os: windows-latest
            triplet: x64-windows
          - os: macos-latest
            triplet: x64-osx

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: '834977918592e4f5d5ec5fe48ba338c608faf9f9'

      - name: Setup CMake
        uses: lukka/get-cmake@latest

      - name: Configure CMake
        env:
          # run-vcpkg@v11 defaults VCPKG_BINARY_SOURCES to "clear;x-gha,readwrite", but the
          # x-gha provider needs ACTIONS_CACHE_URL/ACTIONS_RUNTIME_TOKEN, which current GitHub
          # runners no longer expose (the classic Actions cache service was decommissioned).
          # That made `vcpkg install` hard-fail at project(). Disable remote binary caching so
          # dependencies build from source. Step-level env overrides what run-vcpkg exported.
          VCPKG_BINARY_SOURCES: clear
        run: cmake -B build -S . -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }} -DTARGETS_BUILD_EXAMPLES=ON -DTARGETS_BUILD_TESTS=OFF -DCMAKE_BUILD_TYPE=Release

      - name: Build Examples
        run: cmake --build build --config Release

      # Debug is the only configuration cpp_target injects edit-and-continue debug info into,
      # so a Release build compiles none of it and a conflict between that flag and a target's
      # own flags reaches a release unseen. The examples opt into the hygiene knobs, LTO among
      # them, which makes them the ones to build. A separate build tree leaves the Release
      # artifacts the steps below run intact; the configuration goes on the build line as well
      # as the configure line, for the multi-config generators.
      - name: Configure CMake (Debug)
        env:
          VCPKG_BINARY_SOURCES: clear
        run: cmake -B build-debug -S . -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }} -DTARGETS_BUILD_EXAMPLES=ON -DTARGETS_BUILD_TESTS=OFF -DCMAKE_BUILD_TYPE=Debug

      - name: Build Examples (Debug)
        run: cmake --build build-debug --config Debug

      - name: Test executable_with_deps example (Ubuntu/macOS)
        if: runner.os != 'Windows'
        run: |
          if [ -f build/examples/executable_with_deps/CalculatorApp ]; then
            ./build/examples/executable_with_deps/CalculatorApp
          else
            echo "CalculatorApp executable not found"
            exit 1
          fi

      - name: Test executable_with_deps example (Windows)
        if: runner.os == 'Windows'
        run: |
          if (Test-Path "build\examples\executable_with_deps\Release\CalculatorApp.exe") {
            & "build\examples\executable_with_deps\Release\CalculatorApp.exe"
          } else {
            Write-Error "CalculatorApp.exe not found"
            exit 1
          }

      # Runs the SHARED-library example. On Windows this only launches if Greeter.dll was
      # staged next to GreeterApp.exe (proving DLL staging) and the exe linked against a
      # populated import library (proving EXPORT_HEADER exports symbols). On Ubuntu/macOS it
      # links the shared object, found via the build-tree RPATH.
      - name: Test shared_library example (Ubuntu/macOS)
        if: runner.os != 'Windows'
        run: |
          if [ -f build/examples/shared_library/GreeterApp ]; then
            ./build/examples/shared_library/GreeterApp
          else
            echo "GreeterApp executable not found"
            exit 1
          fi

      - name: Test shared_library example (Windows)
        if: runner.os == 'Windows'
        run: |
          if (Test-Path "build\examples\shared_library\Release\GreeterApp.exe") {
            & "build\examples\shared_library\Release\GreeterApp.exe"
          } else {
            Write-Error "GreeterApp.exe not found"
            exit 1
          }

      # Runs the DATA-staging example. DataApp opens a data file by relative name, so it only
      # succeeds if the DATA attribute copied message.txt into the executable's own directory;
      # the exe is run FROM that directory to prove the file landed next to it.
      - name: Test data_files example (Ubuntu/macOS)
        if: runner.os != 'Windows'
        run: |
          if [ -f build/examples/data_files/DataApp ]; then
            (cd build/examples/data_files && ./DataApp)
          else
            echo "DataApp executable not found"
            exit 1
          fi

      - name: Test data_files example (Windows)
        if: runner.os == 'Windows'
        run: |
          if (Test-Path "build\examples\data_files\Release\DataApp.exe") {
            Push-Location build\examples\data_files\Release
            & .\DataApp.exe
            Pop-Location
          } else {
            Write-Error "DataApp.exe not found"
            exit 1
          }

      - name: Upload build artifacts
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: build-logs-${{ matrix.os }}
          path: |
            build/**/*.log
            build/CMakeFiles/**/*.log
            build-debug/**/*.log
            build-debug/CMakeFiles/**/*.log

  cmake-floor:
    name: Configure and build at the declared CMake floor
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # Every other job installs the newest CMake, so the floor declared in
      # cmake/Targets.cmake, the README and docs/API.md would otherwise be a claim nothing
      # checks. The version is pinned to an exact release archive rather than resolved by an
      # action, so this job cannot quietly start testing a different version than it names.
      - name: Install CMake at the declared floor
        run: |
          curl -fsSL -o cmake-floor.tar.gz \
            https://github.com/Kitware/CMake/releases/download/v3.20.6/cmake-3.20.6-linux-x86_64.tar.gz
          mkdir -p "$HOME/cmake-floor"
          tar -xzf cmake-floor.tar.gz -C "$HOME/cmake-floor" --strip-components=1
          echo "$HOME/cmake-floor/bin" >> "$GITHUB_PATH"

      - name: Confirm the pinned CMake is the one on PATH
        shell: bash
        run: |
          version="$(cmake --version | head -n 1)"
          echo "$version"
          case "$version" in
            "cmake version 3.20."*) ;;
            *) echo "expected CMake 3.20.x, got: $version"; exit 1 ;;
          esac

      # The examples cover cpp_library and cpp_binary, the install/export and SHARED paths,
      # DATA staging, embed_binary, and the hygiene knobs. They do not call cpp_test, and the
      # codegen rules find no FlatBuffers or Protocol Buffers on a bare runner, so for those
      # three this proves only that including them at the floor is clean -- their own version
      # guards run in the test-suite job instead. Whatever the examples do reach that needs
      # more than the floor fails the configure here; a guard that degrades to a diagnostic is
      # caught by the warning check. The toolchain_hygiene example uses the deprecated
      # file-list spelling on purpose, so its CMake Deprecation Warning is expected and only a
      # plain CMake Warning fails the job.
      - name: Configure examples at the floor
        shell: bash
        run: |
          cmake -B build-floor -S . \
            -DTARGETS_BUILD_EXAMPLES=ON -DTARGETS_BUILD_TESTS=OFF \
            -DCMAKE_BUILD_TYPE=Release 2>&1 | tee configure-floor.log
          if grep -q '^CMake Warning' configure-floor.log; then
            echo "Configuring at the CMake floor produced a warning; see the log above."
            exit 1
          fi

      - name: Build examples at the floor
        run: cmake --build build-floor

  consume-port:
    name: Consume in-repo vcpkg port on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            triplet: x64-linux
          - os: windows-latest
            triplet: x64-windows
          - os: macos-latest
            triplet: x64-osx

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: '834977918592e4f5d5ec5fe48ba338c608faf9f9'

      - name: Setup CMake
        uses: lukka/get-cmake@latest

      # Installs the in-repo ports/targets overlay port end-to-end and configures a real
      # consumer that calls find_package(Targets CONFIG REQUIRED). This fails if the port
      # ever regresses to installing a layout that find_package cannot resolve.
      - name: Configure consumer against the overlay port
        env:
          # See the Build Examples job: disable the broken x-gha binary cache so vcpkg installs
          # the overlay port (and its host tools) by building from source instead of failing.
          VCPKG_BINARY_SOURCES: clear
        run: cmake -B build-consume -S tests/consume_port -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }} -DVCPKG_OVERLAY_PORTS="${{ github.workspace }}/ports" -DCMAKE_BUILD_TYPE=Release

      - name: Build consumer
        run: cmake --build build-consume --config Release

      - name: Run consumer (Ubuntu/macOS)
        if: runner.os != 'Windows'
        run: ./build-consume/greet

      - name: Run consumer (Windows)
        if: runner.os == 'Windows'
        run: .\build-consume\Release\greet.exe

  install-export:
    name: Install + downstream find_package on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup CMake
        uses: lukka/get-cmake@latest

      # End-to-end proof of the install/export feature. The producer is the
      # examples/install_export project: a cpp_library marked INSTALL EXPORT. It has no
      # external dependencies, so no vcpkg toolchain is needed -- the OS's default compiler
      # (gcc/clang/MSVC) suffices. Build it and install it to a staging prefix.
      - name: Configure producer (install_export example)
        run: cmake -B build-produce -S examples/install_export -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/stage"

      - name: Build producer
        run: cmake --build build-produce --config Release

      - name: Install producer
        run: cmake --install build-produce --config Release

      # The consumer (tests/consume_install) does NOT include Targets; it relies solely on
      # the generated package config. find_package(WidgetKit CONFIG REQUIRED) must resolve
      # against the staging prefix and the exported WidgetKit::Widget target must link.
      - name: Configure consumer against the install prefix
        run: cmake -B build-consume -S tests/consume_install -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="${{ github.workspace }}/stage"

      - name: Build consumer
        run: cmake --build build-consume --config Release

      - name: Run consumer (Ubuntu/macOS)
        if: runner.os != 'Windows'
        run: ./build-consume/use_widget

      - name: Run consumer (Windows)
        if: runner.os == 'Windows'
        run: .\build-consume\Release\use_widget.exe

  test-suite:
    name: Run test suite on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup CMake
        uses: lukka/get-cmake@latest

      # compiler_cache_cross_checkout skips where no cache binary is installed, so without
      # this the cross-checkout claim goes unmeasured on every runner. The version query turns
      # a shim that installed but cannot run into a failed job rather than a silent skip.
      - name: Install ccache (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ccache && ccache --version

      - name: Install ccache (macOS)
        if: runner.os == 'macOS'
        run: brew install ccache && ccache --version

      - name: Install ccache (Windows)
        if: runner.os == 'Windows'
        run: choco install ccache -y --no-progress && ccache --version

      # Runs the project's full CTest suite (tests/unit + tests/integration) with
      # TARGETS_BUILD_TESTS=ON. The top-level project is LANGUAGES NONE and the tests are
      # self-contained script-mode (cmake -P) and configure-mode (cmake -S/-B) sub-projects
      # that only include(Targets) and call the rules -- no external dependencies, so no
      # vcpkg toolchain is needed. The scenarios that enable CXX are covered by each runner's
      # default compiler (gcc/clang/MSVC). Examples are OFF here: they are built and run by
      # the build-examples job. The build tree is shallow (repo-relative "build"), avoiding
      # the deep-path MSVC FileTracker compiler-detection failures seen under long temp paths.
      - name: Configure with tests enabled
        run: cmake -B build -S . -DTARGETS_BUILD_TESTS=ON -DTARGETS_BUILD_EXAMPLES=OFF

      - name: Run CTest suite
        run: ctest --test-dir build --build-config Release --output-on-failure

      # A skipped test keeps the job green, so compiler_cache_cross_checkout could stop
      # running on a runner and nothing would say so -- which is the state this test was
      # written to end. Re-running it alone turns a skip into a failed job.
      - name: Confirm the cross-checkout cache test ran
        shell: bash
        run: |
          ctest --test-dir build --build-config Release --output-on-failure \
            -R compiler_cache_cross_checkout 2>&1 | tee cross-checkout.log
          if grep -qF '***Skipped' cross-checkout.log; then
            echo "compiler_cache_cross_checkout was skipped; this runner measured nothing."
            exit 1
          fi
